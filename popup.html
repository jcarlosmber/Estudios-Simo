<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIMO Prep</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      width: 280px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
    }
    .logo {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #f59e0b, #38bdf8);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      color: #0f172a;
    }
    .job-badge {
      background-color: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 10px;
    }
    .btn-open {
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: opacity 0.2s ease;
    }
    .btn-open:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="Logo" style="width: 34px; height: 34px; border-radius: 8px; box-shadow: 0 2px 8px rgba(37, 99, 235, 0.35);">
    <div>
      <div style="font-size: 14px; font-weight: 800; color: #f8fafc;">SIMO Prep DIAN</div>
      <div style="font-size: 11px; color: #38bdf8; font-weight: 600;">Gestor III • Convocatoria 2676</div>
    </div>
  </div>

  <div class="job-badge">
    <div style="font-size: 10px; color: #f59e0b; font-weight: 700; text-transform: uppercase;">Cargo Seleccionado</div>
    <div id="popupJobTitle" style="font-size: 12px; font-weight: 600; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
      Cargando...
    </div>
  <div style="background: rgba(245, 158, 11, 0.1); border-left: 3px solid #f59e0b; padding: 10px 12px; border-radius: 6px; font-size: 11px; color: #e2e8f0; line-height: 1.45;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 3px;">
      <strong style="color: #f59e0b; font-size: 11px;">💡 Tip Flash PJS:</strong>
      <span id="popupTipCat" style="font-size: 9px; color: #38bdf8; font-weight: 700; background: rgba(56, 189, 248, 0.15); padding: 1px 5px; border-radius: 3px;">Legalidad</span>
    </div>
    <span id="popupTipSnippet">Cargando clave de juicio situacional...</span>
  </div>

  <button id="btnOpenSidePanel" class="btn-open">
    🚀 Abrir Entrenador en Panel Lateral
  </button>

  <script src="tips_data.js"></script>
  <script src="popup.js"></script>
</body>
</html>
