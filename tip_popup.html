<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💡 Clave de Juicio Situacional • DIAN / CNSC</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: linear-gradient(145deg, #0b1120 0%, #131d33 100%);
      color: #f8fafc;
      width: 100vw;
      height: 100vh;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
    }
    .badge {
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: rgba(245, 158, 11, 0.2);
      color: #f59e0b;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid rgba(245, 158, 11, 0.35);
    }
    .title {
      font-size: 20px;
      font-weight: 800;
      color: #f8fafc;
      line-height: 1.35;
    }
    .norma {
      font-size: 14px;
      color: #38bdf8;
      font-weight: 600;
    }
    .body-box {
      background: rgba(11, 17, 32, 0.75);
      border-left: 5px solid #f59e0b;
      padding: 16px 18px;
      border-radius: 8px;
      font-size: 16px;
      line-height: 1.65;
      color: #f1f5f9;
    }
    .resumen-box {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.35);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 15px;
      color: #f8fafc;
      line-height: 1.6;
    }
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }
    .btn-primary {
      flex: 1;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0b1120;
      font-weight: 800;
      border: none;
      padding: 13px 18px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      text-align: center;
      transition: opacity 0.2s;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cbd5e1;
      font-weight: 700;
      padding: 13px 18px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      text-align: center;
    }
    .btn-primary:hover, .btn-secondary:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 20px;" id="tipIcon">💡</span>
        <span id="tipBadge" class="badge">Microaprendizaje Espaciado</span>
      </div>
      <span id="tipRole" style="font-size: 11px; color: #94a3b8; font-weight: 700;">GESTOR III • DIAN 2676</span>
    </div>

    <!-- Banner Fotográfico Temático Curado -->
    <div id="tipBannerContainer" style="position: relative; width: 100%; height: 130px; border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,0.12); display: flex;">
      <img id="tipBannerImg" src="https://images.unsplash.com/photo-1450133064473-71024230f91b?auto=format&fit=crop&w=720&h=240&q=80" alt="Contexto Visual" style="width: 100%; height: 100%; object-fit: cover;">
      <div id="tipBannerBadge" style="position: absolute; bottom: 8px; left: 8px; background: rgba(11, 17, 32, 0.88); backdrop-filter: blur(4px); color: #f59e0b; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 4px; border: 1px solid rgba(245, 158, 11, 0.4);">
        🏛️ Misionalidad DIAN & Marco Legal
      </div>
    </div>

    <div>
      <h3 id="tipTitle" class="title">Cargando Clave Situacional...</h3>
      <div id="tipNorma" class="norma" style="margin-top: 4px;">Constitución Política y Estatuto Tributario</div>
    </div>

    <div id="tipBody" class="body-box">
      Cargando contenido...
    </div>

    <div id="tipResumen" class="resumen-box">
      <strong style="color: #f59e0b;">💡 Regla Rápida:</strong> <span id="tipResumenText">...</span>
    </div>

    <div class="actions">
      <button id="btnEntendido" class="btn-primary">¡Anotado! Continuar navegando 🚀</button>
      <button id="btnOpenSidebar" class="btn-secondary" title="Abrir simulador completo">Abrir Panel ➔</button>
    </div>
  </div>

  <script src="image_catalog.js"></script>
  <script src="tips_data.js"></script>
  <script src="tip_popup.js"></script>
</body>
</html>
